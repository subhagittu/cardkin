<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" role="img" aria-label="Axis Bank">
  <!-- Upward-pointing solid triangle (Axis brand mark) -->
  <polygon points="32,6 58,58 6,58" fill="#97144d"/>
  <!-- White inner cutout to form hollow inner triangle -->
  <polygon points="32,18 50,52 14,52" fill="white"/>
  <!-- Red inner fill (forms the A shape) -->
  <polygon points="32,24 46,50 18,50" fill="#97144d"/>
  <!-- Horizontal bar of 'A' -->
  <rect x="21" y="42" width="22" height="5" fill="white"/>
  <!-- AXIS text -->
  <text x="68" y="34" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#97144d" letter-spacing="0">AXIS</text>
  <text x="68" y="52" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#97144d" letter-spacing="3.5">BANK</text>
</svg>

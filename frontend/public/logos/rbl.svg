<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" role="img" aria-label="RBL Bank">
  <!-- RBL Bank logo: Modern dark blue R mark + RBL Bank text -->
  <!-- Dark circle / arc emblem -->
  <circle cx="32" cy="35" r="27" fill="none" stroke="#003087" stroke-width="5"/>
  <!-- Stylized 'R' inside circle -->
  <text x="32" y="46" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="30" fill="#003087" text-anchor="middle">R</text>
  <!-- RBL Bank text -->
  <text x="73" y="32" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="20" fill="#003087" letter-spacing="0.5">RBL</text>
  <text x="73" y="52" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#003087" letter-spacing="3">Bank</text>
</svg>

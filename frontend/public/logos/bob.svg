<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" role="img" aria-label="Bank of Baroda">
  <!-- Bank of Baroda logo: iconic Baroda Sun (two B's forming a circle) in orange -->
  <!-- Outer orange circle (sun shape) -->
  <circle cx="35" cy="35" r="28" fill="#F26522"/>
  <!-- White inner cutout circle -->
  <circle cx="35" cy="35" r="20" fill="white"/>
  <!-- Left half orange B (forming sun) -->
  <path d="M35,15 Q20,15 20,35 Q20,55 35,55 Z" fill="#F26522"/>
  <!-- Right half: mirror image -->
  <path d="M35,15 Q50,15 50,35 Q50,55 35,55 Z" fill="#F26522"/>
  <!-- Center white circle to complete the 'sun' / BB look -->
  <circle cx="35" cy="35" r="10" fill="white"/>
  <!-- Bank of Baroda text -->
  <text x="73" y="27" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="13" fill="#F26522" letter-spacing="0">Bank of</text>
  <text x="73" y="43" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="13" fill="#F26522" letter-spacing="0">Baroda</text>
  <text x="73" y="58" font-family="Arial, sans-serif" font-weight="500" font-size="10" fill="#555" letter-spacing="0.5">India's International Bank</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="Kotak Mahindra Bank">
  <!-- Red infinity / leaf overlapping ellipses mark (Kotak brand) -->
  <ellipse cx="22" cy="32" rx="18" ry="12" fill="#ed1c2d" transform="rotate(-30 22 32)"/>
  <ellipse cx="36" cy="32" rx="18" ry="12" fill="#c8001c" transform="rotate(30 36 32)"/>
  <!-- White centre overlap -->
  <ellipse cx="29" cy="32" rx="7" ry="9" fill="white"/>
  <!-- kotak text -->
  <text x="58" y="30" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="20" fill="#ed1c2d" letter-spacing="-0.3">kotak</text>
  <text x="58" y="46" font-family="Arial, sans-serif" font-weight="500" font-size="9" fill="#666" letter-spacing="0.3">Kotak Mahindra Bank</text>
</svg>
